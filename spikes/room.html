<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Room spike — What They Left Running</title>
<style>
  :root {
    --ground:#131611; --surface:#191d16; --ink:#e4e8df; --muted:#8b9486;
    --line:#272c23; --mind:#d9a441; --body:#6fbf92; --flag:#e0754f;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--ground); color:var(--ink); font-family:var(--display); }
  #app { display:grid; grid-template-rows:auto minmax(0,1fr); height:100%; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:9px 16px; background:var(--surface); border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; letter-spacing:-.02em; white-space:nowrap; }
  h1 span { display:block; font-family:var(--mono); font-size:9px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); font-weight:400; }
  a.tog { text-decoration:none; display:inline-block; }
  #who b.focus { color:var(--mind); }
  button, label.tog, select, a.tog { font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; background:#0c0f09; color:var(--ink);
    border:1px solid var(--line); border-radius:3px; padding:5px 9px; cursor:pointer; }
  button[aria-pressed='true'] { background:var(--mind); border-color:var(--mind); color:#191d16; font-weight:700; }
  .controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .note { font-family:var(--mono); font-size:10px; color:var(--muted); margin-left:auto; }
  #view { position:relative; min-height:0; }
  canvas { display:block; }
  #loading { position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--mono); font-size:11px; color:var(--muted); pointer-events:none; }
  #who { position:absolute; left:12px; bottom:10px; font-family:var(--mono); font-size:10.5px;
    color:var(--muted); background:rgba(12,15,9,.88); border:1px solid var(--line);
    border-radius:3px; padding:8px 12px; line-height:1.8; max-width:46ch; }
  #who b { color:var(--ink); }
  #who .act { color:var(--body); }
  #who .head { color:var(--mind); letter-spacing:.1em; text-transform:uppercase; font-size:9px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Room spike<span>cutaway interior · one floor at a time</span></h1>
    <div class="controls">
      <!-- Back to the app, where the city now lives (M4.5). -->
      <a class="tog" href="/" id="tocity">&#8592; colony</a>
      <select id="place"></select>
      <button id="walls" aria-pressed="true">walls</button>
      <label class="tog"><input type="checkbox" id="night" /> night</label>
      <label class="tog"><input type="checkbox" id="spin" /> orbit</label>
    </div>
    <div class="note" id="status">loading…</div>
  </header>
  <div id="view">
    <div id="loading">loading kit…</div>
    <div id="who"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const room = new THREE.Group();
scene.add(room);
const clock = new THREE.Clock();
let mixers = [];
// The overhead marker for the colonist you clicked in the city, if any.
let focusMarkers = [];

// --- scale -----------------------------------------------------------------
// Measured from the kits rather than guessed: a wall is 1.29 tall, a chair 0.47,
// a bed 1.13 long and a character 0.67. At native scale a colonist stands a head
// above a chair back and well under the ceiling — which is the whole reason the
// interior view fixes the size problem the city view has. Against a skyscraper a
// person is a speck; against a chair, a person is a person. So the fudge factor
// belongs to the city view alone; in here everything is drawn at true size.
const FOLK_SCALE = 1.0;

// --- lighting --------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xe8eee0, 0x39402f, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e2, 2.0);
sun.position.set(6, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-10, right:10, top:10, bottom:-10, near:0.5, far:40 });
scene.add(sun);

// --- the places, as rooms --------------------------------------------------
// Each place is one interior. A multi-storey building shows only the floor that
// matters — the ninth floor is somewhere you go, not a level you scroll through,
// so there is never a reason to draw the eight below it.
const ROOMS = {
  'shelter-east':  { name:'East Shelter', w:7, d:6,
      wall:['bedSingle','bedSingle','cabinetBedDrawerTable','bookcaseOpenLow'],
      open:['rugRectangle','lampRoundFloor','chairCushion'] },
  'shelter-under': { name:'The Underhouse', w:6, d:6,
      wall:['bedBunk','bedSingle','cabinetBed'],
      open:['rugRound','tableCoffee','lampSquareFloor','chair'] },
  'loom':          { name:'The Loom Floor', w:8, d:6,
      wall:['bookcaseClosedWide','cabinetTelevisionDoors','desk'],
      open:['chairDesk','loungeSofa','rugSquare','lampRoundFloor'] },
  'market-hall':   { name:'The Market Hall', w:8, d:7,
      wall:['kitchenCabinet','kitchenFridge','bookcaseClosed'],
      open:['tableCloth','chair','chair','stoolBar','pottedPlant'] },
  'tower-lobby':   { name:'Tower Lobby', w:8, d:6,
      wall:['bookcaseOpen','cabinetTelevision','stairs'],
      open:['loungeSofa','loungeChair','tableCoffee','rugRounded','pottedPlant'] },
  'ninth-floor':   { name:'The Ninth Floor', w:7, d:6, ruined:true,
      wall:['bookcaseOpen','cardboardBoxClosed','cardboardBoxOpen'],
      open:['books','cardboardBoxOpen','pottedPlant'] },
  'substation':    { name:'The Substation', w:6, d:6, ruined:true,
      wall:['cabinetTelevisionDoors','cardboardBoxClosed','bookcaseClosed'],
      open:['cardboardBoxOpen','lampSquareFloor','books'] },
  'east-stair':    { name:'The East Stairwell', w:5, d:5, ruined:true,
      wall:['stairs','cardboardBoxClosed'],
      open:['cardboardBoxOpen','books'] },

  // Open-air places are rooms too, as far as this view is concerned: no walls, a
  // grass floor, and scenery from the forest kit instead of furniture. Clicking
  // the orchard in the city has to land somewhere, and "outdoors" is an honest
  // answer rather than a dead link.
  'plaza':         { name:'The Cracked Plaza', w:9, d:8, outdoor:true,
      open:['forest:rocks-low','forest:stones','forest:plant','forest:tree'] },
  'orchard':       { name:'The Orchard Street', w:8, d:8, outdoor:true,
      open:['forest:tree','forest:tree-high','forest:tree','forest:plant'] },
  'green-roof':    { name:'The Green Roof', w:7, d:7, outdoor:true,
      open:['forest:plant','forest:plant','forest:tree','forest:stones'] },
  'river-edge':    { name:'The River Edge', w:8, d:7, outdoor:true,
      open:['forest:rocks-low','forest:tree-high','forest:stones','forest:plant'] },
};

const placeSelect = document.getElementById('place');
Object.entries(ROOMS).forEach(([id, r]) => {
  const o = document.createElement('option');
  o.value = id; o.textContent = r.name;
  placeSelect.appendChild(o);
});
// The city view links in here as room.html?place=<id>. An unknown id falls back
// rather than rendering an empty scene.
const query = new URLSearchParams(location.search);
const asked = query.get('place');
// Who was clicked in the city, if anyone. Cleared as soon as they wander off, so
// the marker never points at an empty patch of floor.
let focusId = query.get('who');
let currentPlace = ROOMS[asked] ? asked : 'shelter-east';
placeSelect.value = currentPlace;

// --- loading ---------------------------------------------------------------
const loader = new GLTFLoader();
const cache = new Map();
const load = (name, kit = 'room') => {
  // A prop may name its own kit: 'forest:tree' comes from the forest set,
  // everything else from the furniture set.
  const colon = name.indexOf(':');
  if (colon > 0) { kit = name.slice(0, colon); name = name.slice(colon + 1); }
  const url = `/kit/${kit}/${name}.glb`;
  if (!cache.has(url)) {
    // A missing prop resolves to null rather than rejecting: one bad name should
    // not take the whole room down.
    cache.set(url, new Promise(res => loader.load(url, res, undefined, () => res(null))));
  }
  return cache.get(url);
};

// --- where things go --------------------------------------------------------
// Measured from the GLBs, not assumed: every model in the furniture kit has its
// origin at a CORNER, not its centre. A floor tile spans x 0..1 and z -1..0; a wall
// spans x 0..1 with its 0.05 thickness on the -z side. (The city, forest and
// character kits are centred — only this one is not.) Placing corner-origin tiles
// as if they were centred put the left wall half a tile off the floor, the back
// wall half a tile onto it, the corner post where neither wall ended, and — since
// the floor is 0.05 thick and a rug 0.01 — every rug inside the floor, with only
// the part hanging past its edge showing.
//
// So the room is laid out by its edges: the floor covers x0..x0+w by z0..z0+d,
// and structural tiles are placed with the corner arithmetic written out. Props go
// through place(), which recentres each one on its own footprint first, so it
// rotates about its middle and its position means what it says.
const FLOOR_TOP = 0.05;

function put(gltf, x, y, z, ry = 0) {
  if (!gltf) return null;
  const o = gltf.scene.clone(true);
  o.position.set(x, y, z);
  o.rotation.y = ry;
  o.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
  room.add(o);
  return o;
}

// A prop, centred on (cx, cz) and standing on `floor`. Returns the wrapper with its
// footprint in userData.size, so callers can keep it clear of walls and edges.
function place(gltf, cx, cz, { ry = 0, scale = 1, floor = FLOOR_TOP } = {}) {
  if (!gltf) return null;
  const model = gltf.scene.clone(true);
  model.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
  model.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(model);
  const centre = box.getCenter(new THREE.Vector3());
  model.position.set(-centre.x, -box.min.y, -centre.z);

  const g = new THREE.Group();
  g.add(model);
  g.position.set(cx, floor, cz);
  g.rotation.y = ry;
  g.scale.setScalar(scale);
  g.userData.size = box.getSize(new THREE.Vector3()).multiplyScalar(scale);
  room.add(g);
  return g;
}

const rand = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };

let showWalls = true;
let folkGltfs = [];
let liveColonists = [];

async function buildRoom(id) {
  room.clear();
  mixers = [];
  focusMarkers = [];

  const spec = ROOMS[id];
  const { w, d } = spec;
  const x0 = -w / 2, z0 = -d / 2;             // the floor's back-left corner
  const floor = spec.outdoor ? 0 : FLOOR_TOP;
  const door = Math.floor(w / 2);             // which back-wall tile is the doorway

  const [floorTile, wall, wallWindow, wallDoorway] = await Promise.all(
    ['floorFull', 'wall', 'wallWindow', 'wallDoorway'].map(n => load(n)));

  if (spec.outdoor) {
    const grass = new THREE.Mesh(
      new THREE.PlaneGeometry(w + 2, d + 2),
      new THREE.MeshLambertMaterial({ color: 0x4a6b3f }));
    grass.rotation.x = -Math.PI / 2;
    grass.receiveShadow = true;
    room.add(grass);
  } else {
    // Tile (i, j) covers x0+i..x0+i+1 by z0+j..z0+j+1; its origin is the +z corner.
    for (let i = 0; i < w; i++) {
      for (let j = 0; j < d; j++) put(floorTile, x0 + i, 0, z0 + j + 1);
    }
  }

  if (showWalls && !spec.outdoor) {
    // Only the two far walls. That is the cutaway: you look in over the open
    // corner, and nothing stands between you and what the colonists are doing.
    // Both walls stand on the floor's edge with their thickness outside it, and
    // their inner face towards the room.

    // Back wall, along z = z0. Unrotated, a wall's face is at local z = 0.
    for (let i = 0; i < w; i++) {
      const choice = i === door ? wallDoorway
        : (rand(i * 3 + 1) > 0.72 ? wallWindow : wall);
      put(choice, x0 + i, 0, z0);
    }

    // Left wall, along x = x0. A quarter turn maps local x 0..1 onto z -1..0, so
    // tile j is anchored at its +z end.
    for (let j = 0; j < d; j++) {
      const choice = rand(j * 7 + 2) > 0.72 ? wallWindow : wall;
      put(choice, x0, 0, z0 + j + 1, Math.PI / 2);
    }

    // With both walls flush to the floor, the only gap left is the 0.05 square
    // where their thicknesses would meet. The kit's corner piece is 0.55 across and
    // made for a different layout; a sliver of plain wall fills the gap exactly and
    // matches it, where the corner piece stood out as a second post.
    const post = put(wall, x0 - 0.05, 0, z0);
    if (post) post.scale.x = 0.05;
  }

  // Props against the back wall, one per tile, skipping the doorway so nothing
  // blocks it, and spread evenly across what is left.
  const wallProps = await Promise.all((spec.wall ?? []).map(n => load(n)));
  const slots = [...Array(w).keys()].filter(i => i !== door);
  wallProps.forEach((p, k) => {
    if (!p) return;
    const slot = slots[Math.min(slots.length - 1,
      Math.round((k + 0.5) * slots.length / wallProps.length - 0.5))];
    const g = place(p, x0 + slot + 0.5, 0, { floor });
    // Back against the wall: centre sits half its own depth out from the face.
    g.position.z = z0 + g.userData.size.z / 2 + 0.03;
  });

  // And the rest out on the floor, kept clear of the middle so people are visible.
  const openProps = await Promise.all((spec.open ?? []).map(n => load(n)));

  // Keep a prop's whole footprint on the floor, whatever way round it ended up.
  const keepOnFloor = (g, margin = 0.1) => {
    if (!g) return;
    const half = Math.max(g.userData.size.x, g.userData.size.z) / 2 + margin;
    g.position.x = Math.min(x0 + w - half, Math.max(x0 + half, g.position.x));
    g.position.z = Math.min(z0 + d - half, Math.max(z0 + half, g.position.z));
  };

  if (spec.outdoor) {
    // Outdoors there is no wall to line things up against, so scenery is scattered
    // and repeated. Four props on a lawn read as a diagram; twenty read as a place.
    for (let i = 0; i < 22; i++) {
      const a = rand(i * 5 + 1) * Math.PI * 2;
      const r = 1.3 + rand(i * 9 + 2) * (Math.min(w, d) / 2 - 0.6);
      place(openProps[i % openProps.length], Math.cos(a) * r, Math.sin(a) * r,
        { ry: rand(i * 11) * Math.PI * 2, scale: 0.7 + rand(i * 3) * 0.5, floor });
    }
  } else {
    openProps.forEach((p, i) => {
      const a = (i / Math.max(openProps.length, 1)) * Math.PI * 2;
      const g = place(p, Math.cos(a) * (w / 2.9), Math.sin(a) * (d / 2.9) + 0.4,
        { ry: Math.floor(rand(i * 11) * 4) * Math.PI / 2, floor });
      keepOnFloor(g);
    });
  }

  if (spec.ruined && !spec.outdoor) {
    const plant = await load('pottedPlant');
    for (let i = 0; i < 4; i++) {
      const g = place(plant, x0 + 0.5 + rand(i) * (w - 1), z0 + 1 + rand(i * 3) * (d - 2),
        { ry: rand(i * 7) * 6, floor });
      keepOnFloor(g);
    }
  }

  placeColonists(floor);
}

// --- colonists -------------------------------------------------------------
// What a colonist is doing drives which animation plays. The kit ships 32 clips,
// so this costs nothing and it is the difference between a room of statues and a
// room of people busy with something.
const ANIMATION_FOR = {
  Rest: 'sit',
  Talk: 'emote-yes',
  Teach: 'interact-right',
  Forage: 'pick-up',
  Salvage: 'interact-right',
  Clear: 'attack-melee-right',
  Build: 'interact-right',
  Tend: 'interact-left',
  Wander: 'walk',
};

function placeColonists(floor = FLOOR_TOP) {
  const spec = ROOMS[currentPlace];
  const here = liveColonists.filter(c => c.placeId === currentPlace);

  here.forEach((c, i) => {
    const gltf = folkGltfs[Math.abs(hash(c.id)) % folkGltfs.length];
    if (!gltf) return;

    const a = (i / Math.max(here.length, 1)) * Math.PI * 2 + 0.6;
    const person = cloneSkinned(gltf.scene);
    person.position.set(Math.cos(a) * (spec.w / 5), floor, Math.sin(a) * (spec.d / 5) + 0.3);
    person.rotation.y = -a + Math.PI;
    person.scale.setScalar(FOLK_SCALE);

    if (c.id === focusId) {
      // Marking the one you clicked. A ring at their feet turned out to be hidden by
      // the character standing on it, so the marker goes overhead where nothing can
      // occlude it, and a ring on the floor underneath widens it enough to catch the
      // eye at this camera distance.
      const gold = () => new THREE.MeshBasicMaterial({ color: 0xd9a441, side: THREE.DoubleSide });

      const ring = new THREE.Mesh(new THREE.RingGeometry(0.46, 0.58, 32), gold());
      ring.rotation.x = -Math.PI / 2;
      // Floor tiles are 0.05 thick; anything lower is buried inside them.
      ring.position.set(person.position.x, floor + 0.02, person.position.z);
      room.add(ring);

      const pin = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.26, 4), gold());
      pin.rotation.x = Math.PI;                       // point down, at the head
      pin.position.set(person.position.x, floor + 0.67 * FOLK_SCALE + 0.3, person.position.z);
      pin.userData.bob = pin.position.y;
      focusMarkers.push(pin);
      room.add(pin);
    }
    person.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
    room.add(person);

    const wanted = ANIMATION_FOR[c.doing] ?? 'idle';
    const clip = gltf.animations.find(x => x.name === wanted)
              ?? gltf.animations.find(x => x.name === 'idle');
    if (clip) {
      const mixer = new THREE.AnimationMixer(person);
      mixer.clipAction(clip).play();
      // Offset the start so eight colonists are not breathing in unison.
      mixer.setTime(rand(i * 13) * 2);
      mixers.push(mixer);
    }
  });

  const list = here.length
    ? here.map(c => `<b${c.id === focusId ? ' class="focus"' : ''}>${c.name}</b> ` +
        `<span class="act">${(c.doing ?? 'deciding').toLowerCase()}</span>`).join('<br />')
    : '<i>nobody is here right now</i>';
  document.getElementById('who').innerHTML =
    `<span class="head">${spec.name}</span><br />${list}`;
}

const hash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; };

// --- live data -------------------------------------------------------------
let nightOverridden = false;
async function poll() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw new Error();
    const s = await r.json();
    liveColonists = s.colonists.map(c => ({
      id: c.id, name: c.displayName, placeId: c.placeId, doing: c.doing }));
    if (!nightOverridden) setNight(s.isNight);
    document.getElementById('status').textContent =
      `live · day ${s.day.toFixed(1)} · ${s.colonists.length} colonists`;
  } catch {
    liveColonists = [
      { id:'c01', name:'C-01', placeId:currentPlace, doing:'Rest' },
      { id:'c02', name:'C-02', placeId:currentPlace, doing:'Talk' },
      { id:'c03', name:'C-03', placeId:currentPlace, doing:'Build' },
    ];
    document.getElementById('status').textContent = 'no colony running · demo occupants';
  }
  buildRoom(currentPlace);
}

function setNight(on) {
  document.getElementById('night').checked = on;
  sun.intensity = on ? 0.35 : 2.0;
  sun.color.set(on ? 0x9fb4e8 : 0xfff4e2);
  hemi.intensity = on ? 0.4 : 1.1;
  scene.background = new THREE.Color(on ? 0x0e1218 : 0x232b1e);
}

// --- camera ----------------------------------------------------------------
const FRUSTUM = 4.6;
let camera, controls;
function makeCamera() {
  const w = view.clientWidth, h = view.clientHeight;
  const aspect = w / h;
  camera = new THREE.OrthographicCamera(-FRUSTUM * aspect, FRUSTUM * aspect, FRUSTUM, -FRUSTUM, 0.1, 120);
  camera.position.set(9, 8, 9);
  if (controls) controls.dispose();
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.5, 0);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI / 2.2;
  controls.update();
}

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  const aspect = w / h;
  Object.assign(camera, { left:-FRUSTUM * aspect, right:FRUSTUM * aspect, top:FRUSTUM, bottom:-FRUSTUM });
  camera.updateProjectionMatrix();
}

makeCamera();
setNight(false);
resize();
new ResizeObserver(resize).observe(view);

placeSelect.onchange = e => { currentPlace = e.target.value; buildRoom(currentPlace); };
document.getElementById('walls').onclick = e => {
  showWalls = !showWalls;
  e.target.setAttribute('aria-pressed', String(showWalls));
  buildRoom(currentPlace);
};
document.getElementById('night').onchange = e => { nightOverridden = true; setNight(e.target.checked); };
let spinning = false;
document.getElementById('spin').onchange = e => (spinning = e.target.checked);

function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  mixers.forEach(m => m.update(dt));
  // A slow bob and spin, so the marker reads as an overlay rather than scenery.
  const t = performance.now() * 0.002;
  focusMarkers.forEach(p => { p.position.y = p.userData.bob + Math.sin(t) * 0.07; p.rotation.y = t; });
  if (spinning) {
    const t = performance.now() * 0.00018;
    camera.position.x = Math.cos(t) * 13;
    camera.position.z = Math.sin(t) * 13;
    camera.lookAt(0, 0.5, 0);
  }
  controls.update();
  renderer.render(scene, camera);
}
frame();

(async () => {
  folkGltfs = (await Promise.all(
    ['a','b','c','d','e','f'].flatMap(s => [`character-male-${s}`, `character-female-${s}`])
      .map(n => load(n, 'folk')))).filter(Boolean);
  document.getElementById('loading').remove();
  await poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
